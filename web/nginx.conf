# Security headers and TLS for nginx. Replace example.com and the certificate paths.
# Explanations: README.md in this folder.

# HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # nginx 1.25.1+; on older versions use "listen 443 ssl http2;" instead
    server_name example.com www.example.com;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    server_tokens off;

    # Start HSTS with max-age=300 and raise it once every subdomain works over HTTPS.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Report-only first: check the browser console, add the hosts you need,
    # then rename to Content-Security-Policy to enforce.
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;

    # Careful: an add_header inside a location block replaces ALL of the ones above
    # for that location. Repeat them there, or put them in a file and include it.

    location / {
        root /var/www/example.com;
    }
}
