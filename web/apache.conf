# Security headers and TLS for Apache 2.4. Needs mod_ssl and mod_headers
# (a2enmod ssl headers). Replace example.com and the certificate paths.
# Explanations: README.md in this folder.

# These two go in the main server config, not inside a VirtualHost.
ServerTokens Prod
ServerSignature Off

# HTTP to HTTPS
<VirtualHost *:80>
    ServerName example.com
    ServerAlias www.example.com
    Redirect permanent / https://example.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName example.com
    ServerAlias www.example.com
    DocumentRoot /var/www/example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/example.com/privkey.pem
    SSLProtocol -all +TLSv1.2 +TLSv1.3

    # Start HSTS with max-age=300 and raise it once every subdomain works over HTTPS.
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # Report-only first: check the browser console, add the hosts you need,
    # then rename to Content-Security-Policy to enforce.
    Header always set Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; upgrade-insecure-requests"
</VirtualHost>
